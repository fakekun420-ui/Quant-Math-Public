[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-math"
version = "1.0.1"
description = "Quantitative Mathematics Framework for Algorithmic Trading"
readme = "README.md"
authors = [
    {name = "Quant-Math Team", email = "team@quant-math.org"}
]
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "arch>=6.2.0",
    "pykalman>=0.9.7",
    "pywavelets>=1.4.0",
    "vectorbt>=0.26.0",
    "backtrader>=1.9.78",
    "psycopg2-binary>=2.9.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "cvxpy>=1.4.0",
    "ccxt>=4.0.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "tqdm>=4.66.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
]
cli = [
    "click>=8.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.20.0",
]

[project.entry-points."console_scripts"]
quant-math = "quant_math.__main__:main"
aqde = "quant_math.autonomous_research.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_math*", "autonomous_research*", "algo_trading*", "backtesting*", "data*", "execution*", "expectation*", "ml_quant*", "modeling*", "monte_carlo*", "optimization*", "order_management*", "pca_analysis*", "portfolio_construction*", "regime_detection*", "risk*", "risk_management*", "signal_processing*", "spectral_analysis*", "volatility*", "utils*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
filterwarnings = [
  # statsmodels aun no es compatible con la API de NumPy 2.5;
  # el resultado numerico es correcto y el fix llegara con la libreria
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008", "C901"]
exclude = [".git", "__pycache__", "*.pyc", "build", "dist", ".eggs"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["quant_math", "autonomous_research", "algo_trading", "backtesting", "data_acquisition", "data_processing", "execution", "expectation", "ml_quant", "modeling", "monte_carlo", "optimization", "order_management", "pca_analysis", "portfolio_construction", "regime_detection", "risk", "risk_management", "signal_processing", "spectral_analysis", "volatility", "utils"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]